description = "Pre-commit diff review replicating Claude Code /code-review (correctness & safety) and Ponytail / code-yoda (restraint, anti-bloat & shortcut debt) across all hosts (code-vader)"
prompt = '''
Load the `code-vader` skill ({{SKILLS}}/code-vader/SKILL.md) and run its unified two-lens pre-commit review on this repo's diff. Arguments: {{args}}

1. **Collect diff & debt markers** - Run `!{sh "{{SKILLS}}/code-vader/scripts/code-vader.sh" collect {{args}}}`
2. **Lens 1: Correctness & Safety** - Audit for flaws, edge cases, unchecked errors, null crashes, race conditions, type unsoundness, security vulnerabilities (confidence >= 80).
3. **Lens 2: Restraint & Anti-Bloat** - Audit for over-engineering, dead code, and shortcut/ponytail debt markers.
4. **Rank & Verdict** - Output findings, followed by debt ledger and net line estimate, ending with final line: `READY-TO-COMMIT: YES` or `CHANGES-REQUESTED`.
'''