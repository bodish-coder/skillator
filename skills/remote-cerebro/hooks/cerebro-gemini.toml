decision = "deny"
priority = 999

# 2. Reads ask, so the bridge can auto-allow in-cwd reads and send the rest to the phone.
[[rule]]
toolName = ["read_file", "read_many_files", "glob", "grep_search", "list_directory"]
decision = "ask_user"
priority = 900

# 3. Shell, edit, write and fetch always ask.
[[rule]]
toolName = ["run_shell_command", "write_file", "replace", "web_fetch"]
decision = "ask_user"
priority = 900

# 4. Every MCP tool asks.
[[rule]]
toolName = "*"
mcpName = "*"
decision = "ask_user"
priority = 800
